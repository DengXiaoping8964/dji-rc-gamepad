
[meta]
name = shooter

[auto]
process = bf4.exe bf1.exe bfv.exe bf2042.exe gtav.exe rdr2.exe saintsrow.exe justcause3.exe justcause4.exe
title =

[hold]
ms = 300

[modifiers]
L = btn.fn
R = btn.rth

[pad]
A = btn.rec
B = btn.pv
X = btn.fn
Y = btn.rth
LB = mode.sport
RB = mode.normal
; 射击游戏里 RT 是开火、LT 是瞄准，拨轮一个不够时把 RB 也当备用开火
LT = dial.neg
RT = dial.pos

START.L = btn.pv
BACK.L = btn.rec
LS.L = btn.rth
DPAD_UP.L = stick.rx>0.85
DPAD_DOWN.L = stick.rx<-0.85
DPAD_LEFT.L = stick.ry<-0.85
DPAD_RIGHT.L = stick.ry>0.85

A.R = btn.rec
X.R = btn.pv
Y.R = btn.fn
START.R = mode.cine

[axis]
LX = stick.lx
LY = stick.ly
RX = stick.rx
RY = stick.ry
LT = dial.neg
RT = dial.pos
