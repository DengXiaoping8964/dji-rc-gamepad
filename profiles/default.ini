
[meta]
name = default

[auto]
process =
title =

[hold]
; 长按多少毫秒算"进入修饰层"。短按仍然是下面 base 段里的按键。
ms = 350

[modifiers]
; L = 长按自定义键, R = 长按急停/返航键
L = btn.fn
R = btn.rth

[pad]
; ---- 基础层：短按 ----
A = btn.rec
X = btn.pv
B = btn.rth
Y = btn.fn
; 三段飞行挡位开关直接当三个肩键用
LB = mode.sport
RB = mode.normal
BACK = mode.cine

; ---- L 层：长按自定义键 ----
START.L = btn.rec
LS.L = btn.pv
RS.L = btn.rth
DPAD_UP.L = stick.ry>0.8
DPAD_DOWN.L = stick.ry<-0.8
DPAD_LEFT.L = stick.rx<-0.8
DPAD_RIGHT.L = stick.rx>0.8

; ---- R 层：长按急停/返航键 ----
A.R = btn.rec
X.R = btn.pv
Y.R = btn.fn
LB.R = mode.sport
RB.R = mode.normal
START.R = mode.cine
DPAD_UP.R = stick.rx>0.85
DPAD_DOWN.R = stick.rx<-0.85
DPAD_LEFT.R = stick.ry<-0.85
DPAD_RIGHT.R = stick.ry>0.85

[axis]
LX = stick.lx
LY = stick.ly
RX = stick.rx
RY = stick.ry
; 单个云台拨轮拆成两个模拟扳机：向前拨 = RT，向后拨 = LT
LT = dial.neg
RT = dial.pos
